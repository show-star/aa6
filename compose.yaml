services:
  control:
    image: ubuntu:22.04
    container_name: control
    hostname: control
    command: sleep infinity
  node1:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node1
    hostname: node1
    ports:
      - "8091:80"
  node2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node2
    hostname: node2
    ports:
      - "8092:80"
